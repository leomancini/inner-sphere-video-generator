<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1728, initial-scale=1" />
    <title>1728×1080 Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ccc;
      }

      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1728px;
        height: 1080px;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .area {
        position: absolute;
        overflow: hidden;
      }

      /* Was #rect-top (y128, h285) + #rect-bottom (y665, h285). Merged into
         one panel spanning both plus the 252px gap: y128 -> y950. The border
         is inside the box (box-sizing: border-box), so the panel's outer
         footprint stays exactly 435x822. */
      #captions {
        left: 1238px;
        top: 128px;
        width: 435px;
        height: 822px;
        border-radius: 22px;
        background: #000;
        border: 2px solid #6b6b6b;
      }

      #circle {
        left: 96px;
        top: 100px;
        width: 875px;
        height: 875px;
        border-radius: 50%;
        background: #000;
      }

      /* Both areas are turned 270deg (a quarter-turn counter-clockwise).
         #circle is square, so the footage needs no size compensation — the
         caption panel does, see #caption-inner. */
      #rotor {
        width: 875px;
        height: 875px;
        transform: rotate(270deg);
      }

      /* Source is 854x480; `cover` into an 875 square already fills the height
         exactly and crops the sides, so a vertical object-position would do
         nothing. Scaling from the top edge is what actually pushes in on the
         top of the frame. --zoom 1 shows the full height, 2 shows the top half. */
      #video {
        display: block;
        width: 875px;
        height: 875px;
        object-fit: cover;
        --zoom: 1.6;
        transform: scale(var(--zoom));
        transform-origin: top center;
      }

      /* Turned with the footage. A quarter-turn swaps the axes, so the content
         box is authored at the panel's dimensions REVERSED (822x435) and
         rotated back into the 435x822 panel. Centring is done about the box's
         own centre, so the rotated result lands on the panel's integer edges
         even though the untransformed offsets are fractional. */
      #caption-inner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 822px;
        height: 435px;
        padding: 34px 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translate(-50%, -50%) rotate(270deg);
      }

      /* One cue at a time. The longest line in this transcript is 40 chars and
         Roboto Mono advances at ~0.6em, so 56px wraps the worst case to three
         lines (~226px) inside the 367px of usable height — it never clips. */
      #cue {
        font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: 56px;
        font-weight: 500;
        line-height: 1.3;
        /* Caps carry no descenders and read tighter, so the negative tracking
           the mixed-case setting used is relaxed. Roboto Mono advances every
           glyph identically, so upper-casing itself shifts no widths. */
        letter-spacing: 0.01em;
        text-transform: uppercase;
        text-align: center;
        text-wrap: balance;
        color: #ffffff;
        opacity: 1;
        transition: opacity 130ms linear;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="area" id="captions">
        <div id="caption-inner"><div id="cue"></div></div>
      </div>
      <div class="area" id="circle">
        <div id="rotor">
          <video
            id="video"
            src="videos/source/orient.mp4"
            muted
            playsinline
            autoplay
          ></video>
        </div>
      </div>
    </div>
    <script>
      // Center the stage at whole-pixel offsets only — no fractional
      // positions, no scaling, so the 1728x1080 grid never slips.
      const stage = document.getElementById("stage");
      function position() {
        const x = Math.max(0, Math.floor((window.innerWidth - 1728) / 2));
        const y = Math.max(0, Math.floor((window.innerHeight - 1080) / 2));
        stage.style.left = x + "px";
        stage.style.top = y + "px";
      }
      window.addEventListener("resize", position);
      position();

      const video = document.getElementById("video");
      const cueEl = document.getElementById("cue");

      let cues = [];
      let shown = -1;
      let swap = null;

      fetch("captions.json")
        .then((r) => r.json())
        .then((data) => {
          cues = data;
          tick();
        })
        .catch((e) => console.error("caption load failed", e));

      // Index of the last cue that has started at time t, or -1 before the
      // first one. Binary search — this runs every animation frame. The cues
      // are contiguous (largest gap in this transcript is 0.01s), so holding
      // the last-started line needs no separate handling for silence.
      function cueAt(t) {
        let lo = 0,
          hi = cues.length - 1,
          found = -1;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          if (cues[mid].t <= t) {
            found = mid;
            lo = mid + 1;
          } else {
            hi = mid - 1;
          }
        }
        return found;
      }

      // Fade out, swap the text while it is invisible, fade back in. The
      // timeout matches the opacity transition; cues run ~2-3s so it never
      // backs up.
      function show(i) {
        if (i === shown) return;
        shown = i;
        cueEl.style.opacity = "0";
        clearTimeout(swap);
        swap = setTimeout(() => {
          cueEl.textContent = i < 0 ? "" : cues[i].s;
          cueEl.style.opacity = "1";
        }, 130);
      }

      function tick() {
        show(cueAt(video.currentTime));
        requestAnimationFrame(tick);
      }

      // The print opens on black leader, so playback starts past it and the
      // loop returns there rather than to 0. Caption times are absolute video
      // times and need no offset; START lands just as the first cue (19.76s)
      // comes up, so the narration begins with the picture.
      const START = 20;

      function toStart() {
        try {
          video.currentTime = START;
        } catch (e) {
          /* metadata not in yet; loadedmetadata will retry */
        }
      }

      if (video.readyState >= 1) toStart();
      video.addEventListener("loadedmetadata", toStart);
      video.addEventListener("ended", () => {
        toStart();
        video.play().catch(() => {});
      });

      // Autoplay is only permitted while muted; the frame's capture is
      // silent anyway (process.sh muxes in a null audio track). Hold until the
      // webfont is in so a capture never bakes in the fallback face.
      const fonts = document.fonts
        ? document.fonts.ready.catch(() => {})
        : Promise.resolve();
      fonts.then(() => video.play().catch(() => {}));
    </script>
  </body>
</html>
